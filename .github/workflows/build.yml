name: Build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [386, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o "byteShare_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}" .

      - uses: actions/upload-artifact@v4
        with:
          name: byteShare_${{ matrix.goos }}_${{ matrix.goarch }}
          path: byteShare_${{ matrix.goos }}_${{ matrix.goarch }}*
