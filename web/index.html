<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>byteShare</title>
<style>
:root{--bg:#ffffff;--surface:#f5f5f7;--border:#e5e5ea;--text:#1d1d1f;--text2:#86868b;--accent:#007AFF;--red:#FF3B30;--green:#34C759;--radius:12px;--maxW:520px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
input,textarea,button{font-family:inherit}
.page{width:100%;max-width:var(--maxW);height:100vh;display:flex;flex-direction:column;border-left:1px solid var(--border);border-right:1px solid var(--border);margin:0 auto;position:relative;background:var(--bg)}

/* Header */
.head{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;min-height:48px;background:var(--bg)}
.brand{font-weight:700;font-size:15px;color:var(--accent);letter-spacing:-.2px;flex-shrink:0}
.brand-ver{font-size:10px;color:var(--text2);margin-left:4px;margin-right:6px;flex-shrink:0}
.room-name{flex:1;text-align:center;font-size:12px;color:var(--text2);margin:0 10px}
.head-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.head-right .uname{font-size:12px;color:var(--text2);white-space:nowrap}

/* Main */
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto;position:relative;background:var(--bg)}

/* Empty state */
.empty{text-align:center;color:var(--text2)}
.empty .big{font-size:52px;margin-bottom:12px;color:var(--border);font-weight:200;line-height:1}
.empty p{font-size:14px;line-height:1.6}
.empty .sub{font-size:12px;opacity:.6;margin-top:4px}

/* Users grid */
.grid{display:flex;flex-wrap:wrap;gap:12px;align-content:center;justify-content:center;padding:8px;width:100%}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px 12px;border-radius:var(--radius);cursor:default;transition:all .15s;width:94px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.card.click{cursor:pointer}
.card.click:hover{background:var(--surface);transform:translateY(-2px)}
.card .av{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;position:relative;transition:transform .15s;flex-shrink:0}
.card .av .ring{position:absolute;inset:0;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(var(--accent) 0deg,var(--accent) 0deg,transparent 0deg,transparent 360deg);-webkit-mask:radial-gradient(circle,transparent 0%,transparent 90%,#000 90%,#000 100%);mask:radial-gradient(circle,transparent 0%,transparent 90%,#000 90%,#000 100%);opacity:0;transition:opacity .2s}
.card .av .ring.on{opacity:1}
.card.click .av:hover{transform:scale(1.08)}
.card .nm{font-size:12px;color:var(--text);max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.card .tag{font-size:9px;background:var(--green);color:#fff;padding:1px 7px;border-radius:4px;font-weight:700;letter-spacing:.3px}
.card.me{border:2px solid var(--red);border-radius:var(--radius);position:relative}
.card.me .tag{background:var(--red)}
.card .off{width:5px;height:5px;border-radius:50%;background:var(--green)}
.card.me .off{display:none}

/* Room info + join footer */
.foot{border-top:1px solid var(--border);padding:12px 16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#footContent{margin:0 auto}
.foot .big-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
.foot .big-btn:hover{opacity:.88}
.foot #joinBtn{width:280px}
.foot .btns-row{display:flex;gap:8px;width:100%;max-width:300px}
.foot .btns-row .big-btn{flex:1;width:auto}
.foot .switch-btn{background:var(--red);color:#fff;border:none;border-radius:10px;padding:12px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

/* Modal */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.25);z-index:900;display:flex;align-items:center;justify-content:center;animation:fi .2s}
.overlay .box{background:#fff;border-radius:18px;padding:28px 24px;max-width:360px;width:90%;box-shadow:0 12px 48px rgba(0,0,0,.1)}
.overlay .box h3{font-size:15px;font-weight:600;margin-bottom:16px}
.overlay .box p{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}
.overlay .box .big-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:16px;text-align:center;outline:none;letter-spacing:1px;margin-bottom:16px}
.overlay .box .big-input:focus{border-color:var(--accent)}
.overlay .box textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;resize:none;margin-bottom:16px;min-height:70px}
.overlay .box textarea:focus{border-color:var(--accent)}
.overlay .box .btns{display:flex;gap:8px;justify-content:flex-end}
.overlay .box .btns button{padding:8px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer}
.overlay .box .btns .primary{background:var(--accent);color:#fff}
.overlay .box .btns .secondary{background:var(--surface);color:var(--text)}
.overlay .box .fmeta{font-size:12px;color:var(--text2);margin-bottom:12px;word-break:break-all}
@keyframes fi{from{opacity:0}to{opacity:1}}

/* Toast */
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:auto;max-width:90%}
.toast{background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13px;color:var(--text);pointer-events:auto;animation:sd .25s ease;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.toast.err{color:var(--red);border-color:var(--red)}
@keyframes sd{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Transfer progress */
.progs{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);max-width:var(--maxW);width:90%;z-index:100;display:flex;flex-direction:column;gap:4px}
.prog{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:11px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prog .pn{color:var(--text2);margin-bottom:2px}
.prog .bar{height:3px;background:var(--surface);border-radius:2px;overflow:hidden;margin-top:3px}
.prog .fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.prog .pct{font-size:10px;color:var(--text2);margin-top:1px}

/* Floating text msgs */
.tmsgs{position:absolute;left:100%;top:56px;z-index:100;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 140px);overflow-y:auto;pointer-events:none;max-width:240px;padding:0 0 0 8px;width:max-content}
.tmsg{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;pointer-events:auto;animation:fi .25s;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.tmsg .sender{font-weight:600;color:var(--accent);font-size:11px;margin-bottom:2px}
.tmsg .txt{color:var(--text);line-height:1.4;word-break:break-word}
.tmsg .tbot{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.tmsg .cpy-msg{background:none;border:none;color:var(--accent);font-size:9px;cursor:pointer;padding:2px 4px;border-radius:4px;line-height:1;transition:background .15s}
.tmsg .cpy-msg:hover{background:var(--surface)}
.tmsg .time{font-size:9px;color:var(--text2)}

@media(max-width:1000px){
  .tmsgs{position:fixed;top:auto;bottom:56px;right:8px;left:auto;max-width:200px;padding:0}
}
@media(max-width:520px){
  .page{border:none}
  .card{width:84px;padding:10px 8px 8px}
  .card .av{width:50px;height:50px;font-size:18px}
}
</style>
</head>
<body>
<div class="page">

<div class="head">
  <span class="brand">byteShare</span>
  <span class="brand-ver" id="ver"></span>
  <span class="room-name" id="roomName"></span>
  <div class="head-right">
    <span class="uname" id="myName"></span>
  </div>
</div>

<div class="main">
  <div class="grid" id="userGrid">
    <div class="empty">
      <div class="big">~</div>
      <p>加入房间开始共享</p>
      <div class="sub">点击下方按钮输入房间号</div>
    </div>
  </div><!-- /.grid -->
</div><!-- /.main -->

<div class="tmsgs" id="tmsgs"></div>

<div class="foot" id="footer">
  <div id="footContent"></div>
</div>

</div><!-- /page -->

<input type="file" id="upInput" style="display:none">

<div class="toasts" id="toasts"></div>
<div class="progs" id="progs"></div>
<div id="modalRoot"></div>

<script src="/js/app.js"></script>
</body>
</html>
