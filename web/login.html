<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>byteShare</title>
<style>
:root{--bg:#ffffff;--surface:#f5f5f7;--border:#e5e5ea;--text:#1d1d1f;--text2:#86868b;--accent:#007AFF;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
input,button{font-family:inherit}
.box{width:320px;text-align:center}
.logo{font-size:28px;font-weight:700;color:var(--accent);letter-spacing:-.3px;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:28px}
.inp{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;transition:border-color .15s;margin-bottom:14px;text-align:center}
.inp:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:default}
.err{color:#FF3B30;font-size:13px;margin-top:10px;display:none}
.ld{display:none;color:var(--text2);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">byteShare</div>
  <div class="sub">私密文件共享</div>
  <input class="inp" type="password" id="pw" placeholder="密码" autofocus>
  <button class="btn" id="loginBtn">进入</button>
  <div class="err" id="err">密码错误</div>
  <div class="ld" id="ld">验证中…</div>
</div>
<script>
(function(){
var p=document.getElementById('pw'),b=document.getElementById('loginBtn'),e=document.getElementById('err'),l=document.getElementById('ld');
function q(n){return new URLSearchParams(window.location.search).get(n)||'';}
function go(){
  var v=p.value||q('pwd');if(!v){e.style.display='block';return;}
  b.disabled=true;e.style.display='none';l.style.display='block';
  fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'password='+encodeURIComponent(v)})
    .then(function(r){if(r.ok){var rm=q('room');window.location.href=rm?'/room?pwd='+encodeURIComponent(v)+'&room='+encodeURIComponent(rm):'/room?pwd='+encodeURIComponent(v);}else{e.style.display='block';b.disabled=false;l.style.display='none';}})
    .catch(function(){e.textContent='连接失败';e.style.display='block';b.disabled=false;l.style.display='none';});
}
p.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
b.addEventListener('click',go);
var pp=q('pwd');if(pp){p.value=pp;go()}
})();
</script>
</body>
</html>
